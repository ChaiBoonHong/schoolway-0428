[build]
  command = "git clone https://github.com/flutter/flutter.git -b ${FLUTTER_VERSION:-stable} --depth 1 \"$HOME/flutter\" && export PATH=\"$HOME/flutter/bin:$PATH\" && flutter config --enable-web && flutter pub get && flutter build web --release"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "stable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
