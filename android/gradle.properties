org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Relax Kotlin JVM target mismatch from error to warning to allow mixed plugin targets
kotlin.jvm.target.validation.mode=warning

# Workaround for Windows cross-drive Kotlin cache path issues (Pub cache on C:, project on D:)
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Temporary Flutter/AGP compatibility policy.
# Keep both flags disabled until every Android plugin below explicitly supports
# AGP built-in Kotlin and the new DSL:
# cloud_functions, firebase_auth, firebase_core, firebase_database, nfc_manager.
# Upgrade those packages through pubspec/pubspec.lock only. Do not patch PubCache,
# fork, or override the plugins merely to suppress Flutter's migration warning.
# Remove these flags together only after all listed plugins have migrated.
android.builtInKotlin=false
android.newDsl=false
