<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Secure school transport coordination for parents, drivers, and administrators.">
  <meta name="theme-color" content="#0077B6">
  <meta
    name="google-signin-client_id"
    content="137687591166-jui1uj21s0bq6i1hn13bl2it07ate6db.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SchoolWay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SchoolWay</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(
          'firebase-messaging-sw.js',
          {scope: 'firebase-cloud-messaging-push-scope/'}
        );
      });
    }
  </script>
  <!--
    Google Maps for Flutter (Web). The key is injected at build time so it is
    never committed. Replace __GOOGLE_MAPS_WEB_API_KEY__ during deployment, e.g.:

      flutter build web
      sed -i "s/__GOOGLE_MAPS_WEB_API_KEY__/AIza.../g" build/web/index.html

    Create a key restricted to the Maps JavaScript API and your deployed
    origins (e.g. https://schoolway-0428.web.app).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_WEB_API_KEY__&v=3.exp&libraries=places,geometry" async></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
