name: Deploy Flutter Web

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-production
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify repository standards
        run: dart run tool/verify_project_standards.dart
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test Flutter
        run: flutter test

  functions-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Audit production Functions dependencies
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
      - name: Test Functions
        working-directory: functions
        run: npm test
      - name: Test Firestore rules
        working-directory: functions
        run: npm run test:rules

  build-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build for Cloudflare Worker
        run: flutter build web --release --base-href "/"
      - name: Upload Cloudflare build
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-web
          path: build/web
          if-no-files-found: error
          retention-days: 1

  build-github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build for GitHub Pages
        run: flutter build web --release --base-href "/schoolway-0428/"
      - name: Prepare GitHub Pages artifact
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-cloudflare:
    needs:
      - standards
      - flutter-quality
      - functions-quality
      - build-cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v7
      - name: Download Cloudflare build
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-web
          path: build/web
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-github-pages:
    needs:
      - standards
      - flutter-quality
      - functions-quality
      - build-github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
