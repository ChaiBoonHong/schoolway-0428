name: Deploy Flutter Web

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify repository standards
        run: dart run tool/verify_project_standards.dart
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test Flutter
        run: flutter test
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Audit production Functions dependencies
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
      - name: Test Functions
        working-directory: functions
        run: npm test
      - name: Test Firestore rules
        working-directory: functions
        run: npm run test:rules

  deploy-cloudflare:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build for Cloudflare Worker
        run: flutter build web --release --base-href "/"
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  build-github-pages:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build for GitHub Pages
        run: flutter build web --release --base-href "/schoolway-0428/"
      - name: Prepare GitHub Pages artifact
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-github-pages:
    needs: build-github-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
