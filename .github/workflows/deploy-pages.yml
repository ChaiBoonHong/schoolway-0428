name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Verify repository standards
        run: dart run tool/verify_project_standards.dart
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze Flutter
        run: flutter analyze
      - name: Test Flutter
        run: flutter test
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Audit production Functions dependencies
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high
      - name: Test Functions
        working-directory: functions
        run: npm test
      - name: Test Firestore rules
        working-directory: functions
        run: npm run test:rules
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release --base-href "/schoolway-0428/"

      - name: Prepare Pages artifact
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
